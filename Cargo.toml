[workspace]
resolver = "3"
members = ["crates/rail-core", "crates/rail"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.86"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
rail-core = { path = "crates/rail-core" }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
rusqlite = { version = "0.40", features = ["bundled"] }
toml = "1.1"
toml_edit = "0.25"
directories = "6.0"
keyring = "4.2"
oauth2 = "5.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
url = "2.5"
humantime-serde = "1.1"
clap = { version = "4.6", features = ["derive"] }
color-eyre = "0.6"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
tempfile = "3.27"
wiremock = "0.6"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
